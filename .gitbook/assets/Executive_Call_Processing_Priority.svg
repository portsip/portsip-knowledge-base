<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Executive Call-Processing Priority</title>
  <desc id="desc">Flowchart showing how an incoming call to an Executive User is processed by Exception, Selective Call Rejection, Selective Call Acceptance, and Executive Call Filtering.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#3C4043" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#5F6368"/>
    </marker>
    <style>
      .heading { font: 500 38px "Google Sans", Arial, sans-serif; fill: #202124; text-anchor: middle; }
      .subheading { font: 400 20px "Google Sans", Arial, sans-serif; fill: #5F6368; text-anchor: middle; }
      .label { font: 500 22px "Google Sans", Arial, sans-serif; fill: #202124; text-anchor: middle; }
      .detail { font: 400 18px "Google Sans", Arial, sans-serif; fill: #5F6368; text-anchor: middle; }
      .branch { font: 500 17px "Google Sans", Arial, sans-serif; fill: #3C4043; }
      .start { fill: #E8F0FE; stroke: #1A73E8; stroke-width: 2.5; filter: url(#shadow); }
      .decision { fill: #FEF7E0; stroke: #F9AB00; stroke-width: 2.5; filter: url(#shadow); }
      .info { fill: #E8F0FE; stroke: #1A73E8; stroke-width: 2.5; filter: url(#shadow); }
      .reject { fill: #FCE8E6; stroke: #EA4335; stroke-width: 2.5; filter: url(#shadow); }
      .success { fill: #E6F4EA; stroke: #34A853; stroke-width: 2.5; filter: url(#shadow); }
      .line { fill: none; stroke: #5F6368; stroke-width: 3.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1600" rx="28" fill="#F8FAFD"/>

  <text x="800" y="62" class="heading">Executive Call-Processing Priority</text>
  <text x="800" y="98" class="subheading">Incoming calls to an Executive User</text>

  <rect x="350" y="135" width="700" height="100" rx="18" class="start"/>
  <text x="700" y="176" class="label">Incoming Call to Executive User</text>
  <text x="700" y="207" class="detail">Begin call processing</text>

  <path d="M700 235 V280" class="line"/>

  <path d="M700 280 L950 360 L700 440 L450 360 Z" class="decision"/>
  <text x="700" y="352" class="label">1. Exception</text>
  <text x="700" y="383" class="detail">Exception rule matched?</text>

  <path d="M950 360 H1100" class="line"/>
  <text x="1012" y="340" class="branch">Yes</text>
  <rect x="1100" y="305" width="420" height="110" rx="18" class="info"/>
  <text x="1310" y="351" class="label">Apply Exception Treatment</text>
  <text x="1310" y="383" class="detail">Process the call as configured</text>

  <path d="M700 440 V560" class="line"/>
  <text x="720" y="505" class="branch">No</text>

  <path d="M700 560 L950 640 L700 720 L450 640 Z" class="decision"/>
  <text x="700" y="632" class="label">2. Selective Call Rejection</text>
  <text x="700" y="663" class="detail">Rejection rule matched?</text>

  <path d="M950 640 H1100" class="line"/>
  <text x="1012" y="620" class="branch">Yes</text>
  <rect x="1100" y="585" width="420" height="110" rx="18" class="reject"/>
  <text x="1310" y="652" class="label">Reject Call</text>

  <path d="M700 720 V840" class="line"/>
  <text x="720" y="785" class="branch">No</text>

  <path d="M700 840 L950 920 L700 1000 L450 920 Z" class="decision"/>
  <text x="700" y="902" class="label">3. Selective Call Acceptance</text>
  <text x="700" y="933" class="detail">Enabled and no acceptance rule matched?</text>

  <path d="M950 920 H1100" class="line"/>
  <text x="1012" y="900" class="branch">Yes</text>
  <rect x="1100" y="865" width="420" height="110" rx="18" class="reject"/>
  <text x="1310" y="932" class="label">Reject Call</text>

  <path d="M700 1000 V1120" class="line"/>
  <text x="720" y="1065" class="branch">No</text>

  <path d="M700 1120 L950 1200 L700 1280 L450 1200 Z" class="decision"/>
  <text x="700" y="1192" class="label">4. Executive Call Filtering</text>
  <text x="700" y="1223" class="detail">Filter the call?</text>

  <path d="M950 1200 H1100" class="line"/>
  <text x="1000" y="1180" class="branch">Filter</text>
  <rect x="1100" y="1145" width="420" height="110" rx="18" class="success"/>
  <text x="1310" y="1191" class="label">Send to Executive</text>
  <text x="1310" y="1223" class="label">Assistant User</text>

  <path d="M700 1280 V1410" class="line"/>
  <text x="720" y="1350" class="branch">Don't Filter</text>
  <rect x="490" y="1410" width="420" height="110" rx="18" class="info"/>
  <text x="700" y="1477" class="label">Ring Executive User</text>
</svg>
